<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>會員註冊｜肆菓 Season Flavor</title>
  <meta name="description" content="加入肆菓會員，享受快速結帳與訂單管理。" />
  <link rel="canonical" href="https://www.seasonflavor.com/register" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=6" />
</head>
<body>

  <nav class="nav scrolled" id="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span class="logo-zh">肆菓</span>
        <span class="logo-en">Season Flavor</span>
      </a>
      <ul class="nav-links">
        <li><a href="/#about">關於我們</a></li>
        <li><a href="/shop">線上訂購</a></li>
        <li><a href="/order-lookup">訂單查詢</a></li>
      </ul>
      <div class="nav-actions">
        <a href="/login" class="nav-action" id="authLink">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
            <path d="M4 21c0-3.866 3.582-7 8-7s8 3.134 8 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="nav-action-label">登入</span>
        </a>
        <a href="/checkout" class="nav-action" aria-label="購物車">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M3 4h2l2.4 12.2A2 2 0 0 0 9.36 18h8.78a2 2 0 0 0 1.95-1.57L21.5 8H6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10" cy="21" r="1" fill="currentColor"/>
            <circle cx="18" cy="21" r="1" fill="currentColor"/>
          </svg>
          <span class="cart-badge" id="cartBadge">0</span>
        </a>
        <button class="nav-toggle" id="navToggle" aria-label="選單">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <header class="page-head">
    <div class="container">
      <p class="section-label">Member</p>
      <h1 class="section-title">會員註冊</h1>
      <p class="body-text center">加入會員，結帳更快、訂單紀錄一目了然</p>
    </div>
  </header>

  <main class="section" style="padding-top: 0;">
    <div class="container">
      <div class="form-card">
        <form id="registerForm">
          <div class="form-error" id="registerError"></div>
          <div class="form-group">
            <label for="name">您的名字</label>
            <input type="text" id="name" required autocomplete="name" />
          </div>
          <div class="form-group">
            <label for="email">電子信箱</label>
            <input type="email" id="email" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="phone">聯絡電話（選填）</label>
            <input type="tel" id="phone" autocomplete="tel" />
          </div>
          <div class="form-group">
            <label for="password">密碼</label>
            <input type="password" id="password" required minlength="8" autocomplete="new-password" />
            <p class="form-hint">至少 8 個字元</p>
          </div>
          <button type="submit" class="btn btn-full">建立帳號</button>
        </form>
        <p class="form-foot">已經有帳號了？<a href="/login">前往登入</a></p>
      </div>
    </div>
  </main>

  <script src="/js/site.js?v=4"></script>
  <script src="/js/script.js?v=4"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('registerError');
      errBox.classList.remove('show');
      try {
        await apiFetch('/api/auth/register', {
          method: 'POST',
          body: {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            password: document.getElementById('password').value,
          },
        });
        location.href = '/account';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.add('show');
      }
    });
  </script>
</body>
</html>
