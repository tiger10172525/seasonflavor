<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{META_DESC}}" />
  <link rel="canonical" href="{{CANONICAL}}" />
  <meta property="og:type" content="product" />
  <meta property="og:site_name" content="肆菓 Season Flavor" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{META_DESC}}" />
  <meta property="og:url" content="{{CANONICAL}}" />
  <meta property="og:image" content="{{OG_IMAGE}}" />
  <meta property="og:locale" content="zh_TW" />
  <meta name="twitter:card" content="summary_large_image" />
  <script type="application/ld+json">{{JSON_LD}}</script>
  <script type="application/ld+json">{{BREADCRUMB_LD}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <nav class="nav scrolled" id="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span class="logo-zh">肆菓</span>
        <span class="logo-en">Season Flavor</span>
      </a>
      <ul class="nav-links">
        <li><a href="/#about">關於我們</a></li>
        <li><a href="/#philosophy">品牌理念</a></li>
        <li><a href="/shop">線上訂購</a></li>
        <li><a href="/order-lookup">訂單查詢</a></li>
        <li><a href="/#contact">聯絡我們</a></li>
      </ul>
      <div class="nav-actions">
        <a href="/login" class="nav-action" id="authLink">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
            <path d="M4 21c0-3.866 3.582-7 8-7s8 3.134 8 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="nav-action-label">登入</span>
        </a>
        <a href="/checkout" class="nav-action" aria-label="購物車">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M3 4h2l2.4 12.2A2 2 0 0 0 9.36 18h8.78a2 2 0 0 0 1.95-1.57L21.5 8H6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10" cy="21" r="1" fill="currentColor"/>
            <circle cx="18" cy="21" r="1" fill="currentColor"/>
          </svg>
          <span class="cart-badge" id="cartBadge">0</span>
        </a>
        <button class="nav-toggle" id="navToggle" aria-label="選單">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="product-detail">
      <figure class="product-detail-img">
        <img src="{{IMAGE}}" alt="{{NAME}}" onerror="this.style.opacity='0'" />
      </figure>
      <div>
        <nav class="breadcrumb" aria-label="breadcrumb">
          <a href="/">首頁</a> ／ <a href="/shop">線上訂購</a> ／ {{NAME}}
        </nav>
        <span class="pf-badge {{BADGE_CLASS}}">{{BADGE_TEXT}}</span>
        <h1 class="section-title" style="margin-top: 0.75rem;">{{NAME}}</h1>
        <p class="section-label">{{NAME_EN}}</p>
        <p class="body-text">{{TAGLINE}}</p>
        <p class="body-text">{{DESCRIPTION}}</p>
        <p class="price" style="font-size: 1.5rem; margin: 1.5rem 0;">NT$ {{PRICE}}</p>
        <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
          <div class="qty-control" id="qtyControl">
            <button type="button" id="qtyMinus" aria-label="減少數量">−</button>
            <span id="qtyValue">1</span>
            <button type="button" id="qtyPlus" aria-label="增加數量">＋</button>
          </div>
          <button class="btn" id="addToCart" data-product-id="{{PRODUCT_ID}}" {{BUY_DISABLED}}>{{BUY_TEXT}}</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" style="margin-top: 6rem;">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <span class="logo-zh">肆菓</span>
          <span class="logo-en">Season Flavor</span>
        </div>
        <p class="footer-tagline">把四季，做成剛剛好的甜</p>
        <div class="footer-links">
          <a href="/shop">線上訂購</a>
          <a href="/order-lookup">訂單查詢</a>
          <a href="https://www.instagram.com/seasonflavor_/" target="_blank" rel="noopener">Instagram</a>
        </div>
        <p class="footer-copy">© 2026 肆菓 Season Flavor. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="/js/site.js"></script>
  <script src="/js/script.js"></script>
  <script>
    let qty = 1;
    const qtyValue = document.getElementById('qtyValue');
    document.getElementById('qtyMinus').addEventListener('click', () => {
      qty = Math.max(1, qty - 1);
      qtyValue.textContent = qty;
    });
    document.getElementById('qtyPlus').addEventListener('click', () => {
      qty = Math.min(99, qty + 1);
      qtyValue.textContent = qty;
    });
    document.getElementById('addToCart').addEventListener('click', (e) => {
      if (e.currentTarget.disabled) return;
      Cart.add(e.currentTarget.dataset.productId, qty);
      showToast('已加入購物車');
    });
  </script>
</body>
</html>
