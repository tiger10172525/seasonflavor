<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>肆菓 擺攤 POS v2</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="肆菓 POS" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    /* 依 Airbnb DESIGN.md：白底、#222 文字、Rausch #ff385c 只用在主要動作、圓角 8/14/pill、單層陰影 */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #ff385c; --primary-active: #e00b41; --primary-disabled: #ffd1da; --error: #c13515;
      --ink: #222; --body: #3f3f3f; --muted: #6a6a6a; --hairline: #ddd; --hairline-soft: #ebebeb;
      --canvas: #fff; --soft: #f7f7f7; --strong: #f2f2f2; --ok: #008a05;
      --r-sm: 8px; --r-md: 14px; --r-xl: 32px;
      --shadow: rgba(0,0,0,.02) 0 0 0 1px, rgba(0,0,0,.04) 0 2px 6px, rgba(0,0,0,.1) 0 4px 8px;
    }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, system-ui, 'PingFang TC', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--canvas); color: var(--ink);
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; cursor: pointer; border: 0; }

    header {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: calc(12px + env(safe-area-inset-top)) 24px 12px;
      background: var(--canvas); border-bottom: 1px solid var(--hairline);
    }
    header h1 { font-size: 1.375rem; font-weight: 700; color: var(--primary); margin-right: auto; letter-spacing: -.02em; }
    .badge { font-size: .8rem; font-weight: 600; padding: 6px 12px; border-radius: 9999px; background: var(--strong); color: var(--ink); }
    .badge.off { background: var(--error); color: #fff; }
    .badge.wait { background: var(--ink); color: #fff; }
    #syncBtn { background: var(--canvas); color: var(--ink); border: 1px solid var(--ink); padding: 8px 18px; border-radius: var(--r-sm); font-size: .9rem; font-weight: 600; }
    #syncBtn:active { background: var(--soft); }

    @media (max-width: 480px) { header { padding-inline: 16px; gap: 6px; } header h1 { font-size: 1.05rem; white-space: nowrap; } .badge { padding: 5px 9px; font-size: .75rem; } #syncBtn { padding: 6px 12px; } }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 32px; padding: 24px; max-width: 1280px; margin: 0 auto; }
    @media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); gap: 24px; padding: 16px 16px 48px; } }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 24px 16px; align-content: start; }
    .prod { background: none; text-align: left; display: flex; flex-direction: column; gap: 4px; position: relative; color: var(--ink); }
    .prod img, .prod .ph { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--r-md); background: var(--strong); transition: transform .15s, box-shadow .15s; }
    .prod:active img, .prod:active .ph { transform: scale(.97); box-shadow: var(--shadow); }
    .prod b { font-size: .95rem; font-weight: 600; margin-top: 8px; }
    .prod span { font-size: .85rem; color: var(--muted); }
    .prod .ph { display: grid; place-items: center; font-size: 2.6rem; font-weight: 600; color: var(--muted); }
    .prod.add .ph { background: none; border: 1.5px dashed var(--hairline); color: var(--muted); }
    .prod.add { color: var(--muted); }
    .prod .del {
      position: absolute; top: 10px; left: 10px; width: 30px; height: 30px; border-radius: 9999px; z-index: 1;
      background: var(--canvas); box-shadow: var(--shadow); color: var(--ink); display: grid; place-items: center; font-size: .8rem;
    }
    .prod .n {
      position: absolute; top: 10px; right: 10px; z-index: 1; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 9999px;
      background: var(--primary); color: #fff; font-weight: 700; display: grid; place-items: center; box-shadow: var(--shadow);
    }

    .panel { background: var(--canvas); border-radius: var(--r-md); padding: 24px; border: 1px solid var(--hairline); box-shadow: var(--shadow); }
    aside { display: flex; flex-direction: column; gap: 24px; }
    @media (min-width: 821px) { aside { position: sticky; top: 88px; align-self: start; } }
    h2 { font-size: 1.375rem; font-weight: 600; letter-spacing: -.02em; margin-bottom: 16px; }

    .line { display: flex; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--hairline-soft); }
    .line .nm { flex: 1; font-size: .95rem; font-weight: 500; }
    .qty { width: 36px; height: 36px; border-radius: 9999px; background: var(--canvas); border: 1px solid var(--hairline); color: var(--ink); font-size: 1.2rem; }
    .qty:active { border-color: var(--ink); }
    .line .q { width: 26px; text-align: center; font-weight: 600; }
    .line .sub { width: 76px; text-align: right; font-size: .9rem; }
    .empty { color: var(--muted); font-size: .9rem; padding: 12px 0; grid-column: 1 / -1; }

    .total { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 0; }
    .total span { color: var(--body); }
    .total strong { font-size: 2rem; font-weight: 700; letter-spacing: -.02em; }

    .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .seg button { padding: 12px 0; border-radius: 9999px; background: var(--canvas); color: var(--ink); border: 1px solid var(--hairline); font-weight: 500; }
    .seg button.on { border: 2px solid var(--ink); font-weight: 600; }

    #cashBox { margin-bottom: 16px; }
    .cashrow { display: flex; gap: 8px; }
    .cashrow input {
      flex: 1; min-width: 0; font-size: 1.2rem; padding: 12px 14px; border: 1px solid var(--hairline); border-radius: var(--r-sm);
      -webkit-user-select: text; user-select: text; color: var(--ink);
    }
    .cashrow input:focus { outline: 2px solid var(--ink); border-color: transparent; }
    .cashrow button { padding: 0 14px; border-radius: var(--r-sm); background: var(--strong); color: var(--ink); font-weight: 500; }
    .change { margin-top: 12px; font-size: 1.05rem; color: var(--body); }
    .change b { color: var(--ok); font-size: 1.4rem; }
    .change.short b { color: var(--error); }

    .pay { width: 100%; height: 56px; border-radius: var(--r-sm); background: var(--primary); color: #fff; font-size: 1.1rem; font-weight: 600; }
    .pay:active { background: var(--primary-active); }
    .pay:disabled { background: var(--primary-disabled); }
    .clear { width: 100%; margin-top: 8px; padding: 10px; background: none; color: var(--ink); font-size: .9rem; font-weight: 600; text-decoration: underline; }

    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
    .stats div { background: var(--soft); border-radius: var(--r-md); padding: 12px 14px; font-size: .8rem; color: var(--muted); }
    .stats b { display: block; font-size: 1.25rem; font-weight: 700; color: var(--ink); margin-top: 2px; }
    .sale { display: flex; gap: 12px; align-items: center; font-size: .85rem; padding: 10px 0; border-bottom: 1px solid var(--hairline-soft); }
    .sale .t { color: var(--muted); width: 44px; }
    .sale .d { flex: 1; }
    .sale .ok { color: var(--ok); font-weight: 600; }
    .sale button { background: none; color: var(--error); font-size: .85rem; font-weight: 600; text-decoration: underline; }

    #toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      background: var(--ink); color: #fff; padding: 14px 24px; border-radius: 9999px; box-shadow: var(--shadow);
      opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>肆菓 擺攤 POS</h1>
    <span class="badge" id="net"></span>
    <span class="badge" id="pending"></span>
    <button id="syncBtn">同步</button>
  </header>

  <main>
    <section class="grid" id="grid"></section>

    <aside>
      <div class="panel">
        <h2>本單</h2>
        <div id="cart"></div>
        <div class="total"><span>合計</span><strong id="total">NT$0</strong></div>

        <div class="seg" id="payment">
          <button data-p="現金" class="on">現金</button>
          <button data-p="轉帳">轉帳</button>
          <button data-p="LINE Pay">LINE Pay</button>
        </div>

        <div id="cashBox">
          <div class="cashrow">
            <input id="cash" type="number" inputmode="numeric" placeholder="收現金" />
            <button data-cash="exact">剛好</button>
            <button data-cash="500">500</button>
            <button data-cash="1000">1000</button>
          </div>
          <div class="change" id="change"></div>
        </div>

        <button class="pay" id="payBtn" disabled>結帳</button>
        <button class="clear" id="clearBtn">清空本單</button>
      </div>

      <div class="panel">
        <h2>今日銷售</h2>
        <div class="stats" id="stats"></div>
        <div id="sales"></div>
      </div>
    </aside>
  </main>

  <div id="toast"></div>

<script src="/admin-pos-v2.js"></script>
</body>
</html>
